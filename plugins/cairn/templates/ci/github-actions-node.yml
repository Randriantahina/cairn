# Starter generated by Cairn. Runs the same gates as the local definition of done.
name: CI
on:
  pull_request:
  push:
    branches: [{{MAIN_BRANCH}}]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "{{NODE_VERSION}}"
      - run: {{INSTALL_COMMAND}}
      - run: {{LINT_COMMAND}}
      - run: {{TEST_COMMAND}}
